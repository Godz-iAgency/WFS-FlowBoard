<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#062a55" />
    <title>WFS FlowBoard — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Segoe UI,Arial,sans-serif;color:#12263a;background:radial-gradient(circle at 50% 20%,#eff5fa,#d6e2ed)}main{width:min(560px,100%);padding:48px;text-align:center;border:1px solid #becdda;border-radius:18px;background:#fff;box-shadow:0 20px 55px rgba(27,58,87,.16)}i{display:block;width:60px;height:60px;margin:0 auto 18px;border-radius:50%;background:#062a55;color:#fff;font-style:normal;font-size:34px;line-height:60px}h1{margin:0 0 12px;color:#062a55}p{color:#5b6d7f;line-height:1.55}button{min-width:150px;min-height:52px;margin-top:12px;border:0;border-radius:8px;color:#fff;background:#062a55;font:700 16px Segoe UI,Arial,sans-serif;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <i aria-hidden="true">!</i>
      <h1>FlowBoard is offline</h1>
      <p>A network connection is required to load authoritative warehouse data. Reconnect before making operational changes.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
